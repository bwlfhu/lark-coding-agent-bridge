name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name }}

    steps:
      - name: Require explicit fork publishing configuration
        env:
          PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          EXPECTED_PACKAGE: ${{ vars.NPM_PACKAGE_NAME }}
        run: |
          if [ "$PUBLISH_ENABLED" != "true" ] || [ -z "$EXPECTED_PACKAGE" ]; then
            echo "::error::Publishing is disabled. Configure NPM_PUBLISH_ENABLED=true, NPM_PACKAGE_NAME, and npm Trusted Publishing for this fork before manually running this workflow."
            exit 1
          fi

      - name: Check out the released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global "npm@^11.5.1" "pnpm@10.33.0"

      - name: Verify tag and package version match
        shell: bash
        env:
          EXPECTED_PACKAGE: ${{ vars.NPM_PACKAGE_NAME }}
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          package_name="$(node -p 'require("./package.json").name')"
          test "${RELEASE_TAG}" = "v${package_version}"
          test "${EXPECTED_PACKAGE}" = "${package_name}"

      - name: Install from the pnpm lockfile
        run: pnpm install --frozen-lockfile

      - name: Test and typecheck
        run: |
          pnpm test
          pnpm typecheck

      - name: Build and verify the exact package artifact
        id: package
        shell: bash
        env:
          PRIVACY_DENYLIST_JSON: ${{ secrets.LARK_BRIDGE_PRIVACY_DENYLIST_JSON }}
        run: |
          patterns="$RUNNER_TEMP/privacy-denylist.json"
          artifact="$RUNNER_TEMP/verified-package.tgz"
          if [ -n "${PRIVACY_DENYLIST_JSON:-}" ]; then
            umask 077
            printf '%s' "$PRIVACY_DENYLIST_JSON" > "$patterns"
            export LARK_BRIDGE_PRIVACY_DENYLIST_FILE="$patterns"
          fi
          unset PRIVACY_DENYLIST_JSON
          pnpm build
          node tools/pack-and-verify.mjs --output "$artifact"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Publish the verified artifact with npm Trusted Publishing
        run: npm publish "${{ steps.package.outputs.artifact }}" --access public --tag latest
